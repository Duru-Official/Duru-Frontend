---
name: 버그 신고
description: 재현 절차·영향·회귀 검증
title: "[Bug] "
body:
- type: textarea
  id: problem
  attributes:
    label: 문제와 영향
    description: 어떤 사용자가 어떤 작업을 할 수 없나요?
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: 발생 환경
    description: 버전/커밋, 브라우저/기기, 실행 환경, 날짜·시간대 등
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: 재현 순서
    placeholder: |-
      1. ...
      2. ...
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: 기대 동작
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: 실제 동작
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: 근거 자료
    description: 화면·로그·오류 코드. 개인정보·토큰·실제 지출 내역은 제거하세요.
- type: textarea
  id: regression
  attributes:
    label: 회귀 확인
    description: 수정 후 다시 확인할 조건, 우회 방법, 최근 관련 변경. 알 수 없으면 미확인으로 적으세요.
