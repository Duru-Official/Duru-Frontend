---
name: 작업 제안
description: 기능·개선·설정·문서의 범위와 완료 기준
title: "[Feature] "
body:
- type: markdown
  attributes:
    value: 요구사항과 완료 조건을 먼저 정리합니다. 실제 지출·일정·개인정보·비밀값을 포함하지 마세요.
- type: dropdown
  id: kind
  attributes:
    label: 작업 유형
    options:
    - Feature
    - Refactor
    - Test
    - Docs
    - Chore
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: 문제와 목적
    description: 누구에게 어떤 불편이 있고 무엇을 개선하나요?
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: 작업 범위
    description: 포함할 내용과 이번 작업에서 다루지 않을 내용을 구분하세요.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 완료 조건
    description: 확인할 수 있는 결과를 체크리스트로 작성하세요.
    placeholder: |-
      - [ ] 사용자가 ...할 수 있다
      - [ ] ...할 때 오류를 안내한다
  validations:
    required: true
- type: textarea
  id: validation
  attributes:
    label: 검증 방법
    description: 정상·실패·경계 조건을 어떤 방법으로 확인할지 적어주세요.
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: 의존성과 미결정 사항
    description: API 계약·상대 저장소·선행 작업·결정할 질문. 없으면 해당 없음.
